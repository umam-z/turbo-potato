    const lastName="Umam";

    const lama="Name:"+firstName+" "+middleName+" "+lastName;
    console.info(template);
    const nilai=90;
    const template2=`Name:${name}, Lulus:${nilai>70}`;
    console.info(template2);
    const multiline=`
    lorem ipsum dolor sit amet consectetur
    adipiscing elit eligendi iusto at ad 
    sunt atque dolorum dignissimos 
    provident est tempore nostrud`;
    document.writeln("<pre>");
    document.writeln(multiline);
